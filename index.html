
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>𝐓𝐎𝐅𝐀𝐍 𝐃𝐀𝐓𝐀𝐁𝐀𝐒𝐄</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="f96JuOe-CWzh5vm-NkMrXgo1tp3eyoaZLaBlSO6Umi4" />
    <script src="https://rawgit.com/eKoopmans/html2pdf/master/dist/html2pdf.bundle.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: url('https://qu.ax/UkdZP.jpg') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            flex-direction: column;
            overflow: hidden;
        }

        h1 {
            font-size: 28px;
            text-transform: uppercase;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0px 0px 15px rgba(0, 255, 204, 0.8);
        }

        .container {
            background: rgba(0, 0, 0, 0.9);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0px 0px 30px rgba(0, 255, 255, 0.7);
            display: inline-block;
            max-width: 400px;
            width: 100%;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #00ffcc;
            background: black;
            color: white;
            font-size: 16px;
            border-radius: 25px;
            text-align: center;
            outline: none;
            box-shadow: 0px 0px 10px rgba(0, 255, 204, 0.7);
        }

        button {
            width: 90%;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #ff00ff, #9900ff);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
            margin-top: 10px;
            box-shadow: 0px 0px 20px rgba(255, 0, 255, 0.7);
        }

        button:hover {
            transform: scale(1.1);
            background: linear-gradient(135deg, #9900ff, #ff00ff);
            box-shadow: 0px 0px 30px rgba(255, 0, 255, 1);
        }

        .response-box {
            background: rgba(0, 0, 0, 0.9);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            color: #00ffcc;
            text-align: left;
            max-width: 90%;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0px 0px 20px rgba(0, 255, 204, 0.7);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: black;
            color: white;
            border: 2px solid #00ffcc;
        }

        th, td {
            border: 1px solid #00ffcc;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #00ffcc;
            color: black;
        }

        .error {
            color: #ff4c4c;
            font-weight: bold;
        }

        #downloadBtn {
            display: none;
            margin-top: 20px;
            background: #00cc66;
            box-shadow: 0px 0px 15px rgba(0, 255, 102, 0.7);
        }
    </style>
</head>
<body>

    <h1>𝐓𝐎𝐅𝐀𝐍 𝐃𝐀𝐓𝐀𝐁𝐀𝐒𝐄</h1>

    <div class="container">
        <input type="text" id="number" placeholder="Enter phone number" required>
        <button id="fetchData">CONTINUE</button>

        <a href="https://t.me/HacksManyMoreCheats" target="_blank" style="display: block; text-align: center; text-decoration: none; margin-top: 10px;">
            <button style="background: #0088cc; box-shadow: 0px 0px 20px rgba(0, 136, 204, 0.7);">
              😈 𝐉𝐎𝐈𝐍 𝐌𝐄 𝐎𝐍 𝐓𝐆 😈
            </button>
        </a>
    </div>

    <div id="responseBox" class="response-box"></div>

    <button id="downloadBtn">Download as PDF</button>

    <script>
        document.getElementById("fetchData").addEventListener("click", async function() {
            const number = document.getElementById("number").value;
            if (number === "") {
                alert("Please enter a valid number.");
                return;
            }

            const url = `https://api.allorigins.win/get?url=${encodeURIComponent(`https://fam-official.serv00.net/sim/api.php?num=${number}&apikey=c72fc65b43aa2881ea88e4dfbc8690f2`)}`;

            try {
                const response = await fetch(url);
                const result = await response.json();
                const apiData = JSON.parse(result.contents);

                if (apiData.status === "success" && apiData.data.length > 0) {
                    let tableHTML = `
                        <table>
                            <tr>
                                <th>Name</th>
                                <th>Mobile</th>
                                <th>CNIC</th>
                                <th>Operator</th>
                                <th>Address</th>
                            </tr>`;

                    apiData.data.forEach(user => {
                        tableHTML += `
                            <tr>
                                <td>${user.Name}</td>
                                <td>${user.Mobile}</td>
                                <td>${user.CNIC}</td>
                                <td>${user.Operator}</td>
                                <td>${user.Address}</td>
                            </tr>`;
                    });

                    tableHTML += `</table>`;
                    document.getElementById("responseBox").innerHTML = tableHTML;
                    document.getElementById("downloadBtn").style.display = "block";
                } else {
                    document.getElementById("responseBox").innerHTML = `<strong class="error">❌ No data found for this number</strong>`;
                    document.getElementById("downloadBtn").style.display = "none";
                }
            } catch (error) {
                document.getElementById("responseBox").innerHTML = `<strong class="error">❌ API Error: ${error.message}</strong>`;
                document.getElementById("downloadBtn").style.display = "none";
            }
        });

        document.getElementById("downloadBtn").addEventListener("click", function () {
            const element = document.getElementById("responseBox");
            const opt = {
                margin:       0.5,
                filename:     'tofandata.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        });
    </script>

</body>
</html>
