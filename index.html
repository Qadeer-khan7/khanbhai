<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mr. Qadeer is Busy</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #000000, #1a1a1a, #000000);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      animation: backgroundPulse 10s infinite;
    }

    @keyframes backgroundPulse {
      0%, 100% {
        background-color: #000000;
      }
      50% {
        background-color: #222222;
      }
    }

    .neon-text {
      font-size: 3rem;
      color: #0ff;
      text-shadow: 0 0 5px #0ff, 0 0 10px #0ff, 0 0 20px #0ff,
                   0 0 40px #0ff, 0 0 80px #0ff;
      animation: flicker 3s infinite alternate;
    }

    @keyframes flicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
        opacity: 1;
        text-shadow: 0 0 5px #0ff, 0 0 10px #0ff, 0 0 20px #0ff,
                     0 0 40px #0ff, 0 0 80px #0ff;
      }
      20%, 24%, 55% {
        opacity: 0.4;
        text-shadow: none;
      }
    }

    .urdu-text {
      font-size: 1.8rem;
      color: #ff00cc;
      margin-top: 20px;
      text-align: center;
      animation: glow 5s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 10px #ff00cc, 0 0 20px #ff00cc;
      }
      to {
        text-shadow: 0 0 20px #ff66cc, 0 0 40px #ff66cc;
      }
    }

    .sparkle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #fff;
      border-radius: 50%;
      animation: sparkleMove 5s linear infinite;
    }

    @keyframes sparkleMove {
      from {
        transform: translateY(0);
        opacity: 1;
      }
      to {
        transform: translateY(100vh);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="neon-text">Our Great Hacker Mr. Qadeer is Busy</div>
  <div class="urdu-text">Mr. Qadeer is Busy</div>

  <!-- Sparkles -->
  <script>
    for (let i = 0; i < 100; i++) {
      const sparkle = document.createElement('div');
      sparkle.className = 'sparkle';
      sparkle.style.left = Math.random() * 100 + 'vw';
      sparkle.style.top = Math.random() * -100 + 'vh';
      sparkle.style.animationDuration = (Math.random() * 5 + 3) + 's';
      document.body.appendChild(sparkle);
    }
  </script>

</body>
</html>
